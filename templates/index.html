<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Portfolio</title>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <div class="px-4 py-4 max-w-screen-2xl mx-auto">

        <div class="flex items-center justify-between mb-4 pb-3 border-b border-gray-800">
            <h1 class="text-base font-bold tracking-widest text-gray-300 uppercase">
                IB Portfolio
            </h1>
            <div class="flex items-center gap-2">
                <nav class="flex items-center gap-1 mr-3 text-xs">
                    <a href="/"
                       class="px-2 py-1 rounded bg-gray-800 text-gray-100 border border-gray-700">Portfolio</a>
                    <a href="/orders"
                       class="px-2 py-1 rounded text-gray-500 hover:text-gray-200 hover:bg-gray-900">Orders</a>
                    <a href="/history"
                       class="px-2 py-1 rounded text-gray-500 hover:text-gray-200 hover:bg-gray-900">History</a>
                </nav>
                <select id="account-select"
                        class="text-xs bg-gray-800 border border-gray-700 rounded px-2 py-1 text-gray-300 cursor-pointer">
                    <option value="ALL">ALL</option>
                </select>
                <button id="account-rename" title="Rename selected account"
                        class="text-sm text-gray-600 hover:text-gray-300 leading-none cursor-pointer hidden">✎</button>
            </div>
        </div>

        <!-- Live content — replaced on each SSE push from /stream-html -->
        <div hx-ext="sse" sse-connect="/stream-html" sse-swap="message">
            <div class="text-gray-600 text-sm py-12 text-center">
                Connecting to data stream…
            </div>
        </div>

    </div>

    {% include "_news_modal.html" %}
    {% include "_info_modal.html" %}

    <script>
    // ── Table sort ────────────────────────────────────────────────────────────
    // Sort state lives here (outside the SSE-swapped div) so it survives
    // fragment updates.  After each swap, the current sort is re-applied.
    (function () {
        // Column indices that contain numbers (strip $, commas before parsing)
        const NUM_COLS = new Set([1, 2, 3, 4, 5, 6, 7]);
        let sortCol = null, sortDir = 1;

        function numVal(text) {
            const n = parseFloat(text.replace(/[$,]/g, ''));
            return isNaN(n) ? null : n;
        }

        function cmp(a, b) {
            // Nulls (represented as "—") always sort last regardless of direction
            if (a === null && b === null) return 0;
            if (a === null) return 1;
            if (b === null) return -1;
            return a < b ? -sortDir : a > b ? sortDir : 0;
        }

        function applySort() {
            if (sortCol === null) return;
            const table = document.querySelector('table[data-sortable]');
            if (!table) return;
            const tbody = table.querySelector('tbody');
            const isNum = NUM_COLS.has(sortCol);
            const rows = Array.from(tbody.querySelectorAll('tr'));
            rows.sort(function (a, b) {
                const cellA = a.cells[sortCol] || {};
                const cellB = b.cells[sortCol] || {};
                const rawA = cellA.dataset && cellA.dataset.sortValue != null ? cellA.dataset.sortValue : (cellA.textContent || '');
                const rawB = cellB.dataset && cellB.dataset.sortValue != null ? cellB.dataset.sortValue : (cellB.textContent || '');
                const va = isNum ? numVal(rawA.trim()) : rawA.trim().toLowerCase();
                const vb = isNum ? numVal(rawB.trim()) : rawB.trim().toLowerCase();
                return cmp(va, vb);
            });
            rows.forEach(function (r) { tbody.appendChild(r); });
            updateMarkers(table);
        }

        function updateMarkers(table) {
            (table || document.querySelector('table[data-sortable]'))
                .querySelectorAll('thead th .sort-marker')
                .forEach(function (m, i) {
                    m.textContent = i === sortCol
                        ? (sortDir > 0 ? ' ↑' : ' ↓')
                        : ' ↕';
                });
        }

        // ── Account selector ──────────────────────────────────────────────────────
    (function () {
        var sel = document.getElementById('account-select');
        var btn = document.getElementById('account-rename');

        function updateRenameBtn() {
            btn.classList.toggle('hidden', sel.value === 'ALL');
        }

        function loadAccounts() {
            fetch('/accounts').then(function (r) { return r.json(); }).then(function (data) {
                sel.innerHTML = '';
                data.accounts.forEach(function (acc) {
                    var opt = document.createElement('option');
                    opt.value = acc.id;
                    opt.textContent = acc.name;
                    if (acc.id === data.selected) opt.selected = true;
                    sel.appendChild(opt);
                });
                updateRenameBtn();
            }).catch(function () {
                // /accounts not ready yet (service still connecting) — retry
                setTimeout(loadAccounts, 2000);
            });
        }

        loadAccounts();

        sel.addEventListener('change', function () {
            fetch('/account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ account: sel.value }),
            });
            updateRenameBtn();
        });

        btn.addEventListener('click', function () {
            var id = sel.value;
            if (id === 'ALL') return;
            var current = sel.options[sel.selectedIndex].textContent;
            var entered = window.prompt('Nickname for ' + id + ':', current === id ? '' : current);
            if (entered === null) return; // cancelled
            fetch('/account/name', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ account: id, name: entered.trim() }),
            }).then(loadAccounts);
        });
    }());

    // ── Secondary metrics row collapse ────────────────────────────────────────
    (function () {
        function isOpen() {
            return localStorage.getItem('secondaryMetrics') === 'open';
        }

        function apply() {
            var open = isOpen();
            var row = document.getElementById('secondary-metrics');
            var btn = document.getElementById('secondary-metrics-toggle');
            if (!row || !btn) return;
            row.classList.toggle('hidden', !open);
            row.classList.toggle('grid', open);
            btn.textContent = open ? '▾ less' : '▸ more';
        }

        document.body.addEventListener('click', function (e) {
            var btn = e.target.closest('#secondary-metrics-toggle');
            if (!btn) return;
            localStorage.setItem('secondaryMetrics', isOpen() ? 'closed' : 'open');
            apply();
        });

        document.body.addEventListener('htmx:afterSwap', apply);
        apply();
    }());

    // ── Notional mode toggle (gross / net) ────────────────────────────────────
    (function () {
        var mode = localStorage.getItem('notionalMode') || 'gross';

        function apply() {
            var isGross = mode === 'gross';
            ['ngav-gross', 'nleg-gross'].forEach(function (cls) {
                document.querySelectorAll('.' + cls).forEach(function (el) {
                    el.classList.toggle('hidden', !isGross);
                });
            });
            ['ngav-net', 'nleg-net'].forEach(function (cls) {
                document.querySelectorAll('.' + cls).forEach(function (el) {
                    el.classList.toggle('hidden', isGross);
                });
            });
            document.querySelectorAll('.notional-toggle').forEach(function (el) {
                el.textContent = '[' + mode + ']';
            });
        }

        document.body.addEventListener('click', function (e) {
            if (e.target.classList.contains('notional-toggle')) {
                mode = mode === 'gross' ? 'net' : 'gross';
                localStorage.setItem('notionalMode', mode);
                apply();
            }
        });

        document.body.addEventListener('htmx:afterSwap', apply);
        apply();
    }());

    // Re-apply sort and restore markers after every SSE fragment swap
        document.body.addEventListener('htmx:afterSwap', applySort);

        // Delegate header clicks across swaps
        document.body.addEventListener('click', function (e) {
            var th = e.target.closest('table[data-sortable] thead th');
            if (!th) return;
            var ths = Array.from(th.closest('tr').querySelectorAll('th'));
            var col = ths.indexOf(th);
            if (sortCol === col) {
                sortDir = -sortDir;
            } else {
                sortCol = col;
                sortDir = 1;
            }
            applySort();
        });
    }());
    </script>
</body>
</html>
